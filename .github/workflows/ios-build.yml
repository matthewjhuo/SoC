name: Build Native iOS App (.ipa & Xcode Project)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build Capacitor iOS App on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build Web Assets
        working-directory: ./sv-uvm-app
        run: |
          npm install
          npm run build

      - name: Add & Sync Capacitor iOS Platform (Swift Package Manager)
        working-directory: ./sv-uvm-app
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 --no-save
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager SPM
          fi
          npx cap copy ios

      - name: Build Unsigned iOS App via Xcodebuild
        working-directory: ./sv-uvm-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .app into Unsigned .ipa (for Sideloadly / AltStore)
        working-directory: ./sv-uvm-app/ios/App
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -qry SoC-DV-iOS.ipa Payload

      - name: Upload iOS .ipa & Xcode Project Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoC-DV-iOS-App
          path: |
            sv-uvm-app/ios/App/SoC-DV-iOS.ipa
            sv-uvm-app/ios/
